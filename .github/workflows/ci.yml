
name: Meridian CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: meridian-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "22"
  PNPM_VERSION: "11.20.0"

jobs:
  api-quality:
    name: API · quality + unit + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://meridian:build-only@127.0.0.1:5432/meridian
        run: pnpm --filter @meridian/api exec prisma generate

      - name: Format check
        run: pnpm --filter @meridian/api format:check

      - name: Typecheck
        run: pnpm --filter @meridian/api typecheck

      - name: Lint
        run: pnpm --filter @meridian/api lint:check

      - name: Unit tests
        run: pnpm --filter @meridian/api test

      - name: Production build
        run: pnpm --filter @meridian/api build

  api-e2e:
    name: API · E2E + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: meridian_test
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://meridian:meridian_ci@127.0.0.1:5433/meridian_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create isolated E2E environment
        shell: bash
        run: |
          cp apps/api/.env.test.example apps/api/.env.test
          sed -i 's/MERIDIAN_PASSWORD/meridian_ci/g' apps/api/.env.test

      - name: Generate Prisma client
        run: pnpm --filter @meridian/api exec prisma generate

      - name: Apply test database migrations
        run: pnpm --filter @meridian/api exec prisma migrate deploy

      - name: E2E tests
        run: pnpm --filter @meridian/api test:e2e

  web-quality:
    name: Web · typecheck + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      API_ORIGIN: http://127.0.0.1:3001
      APP_ORIGIN: http://localhost:3000
      AUTH_COOKIE_SECURE: "false"
      AUTH_ACCESS_COOKIE_MAX_AGE_SECONDS: "900"
      AUTH_REFRESH_COOKIE_MAX_AGE_SECONDS: "604800"
      GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @meridian/web typecheck

      - name: Lint
        run: pnpm --filter @meridian/web lint

      - name: Production build
        run: pnpm --filter @meridian/web build

  dependency-security:
    name: Security · production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  docker-images:
    name: Docker · ${{ matrix.target }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - api-quality
      - web-quality

    strategy:
      fail-fast: false
      matrix:
        target:
          - api
          - web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: meridian-${{ matrix.target }}:ci
          cache-from: type=gha,scope=meridian-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=meridian-${{ matrix.target }}

      - name: Inspect built image
        shell: bash
        run: |
          docker image inspect \
            "meridian-${{ matrix.target }}:ci" \
            --format 'image={{.RepoTags}} size={{.Size}} user={{.Config.User}}'
