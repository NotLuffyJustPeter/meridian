services:
  db:
    image: postgres:18
    container_name: meridian-postgres

    restart: unless-stopped

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meridian}
      POSTGRES_USER: ${POSTGRES_USER:-meridian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - meridian_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-meridian} -d ${POSTGRES_DB:-meridian}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: meridian-mailpit

    restart: unless-stopped

    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    container_name: meridian-jaeger

    restart: unless-stopped

    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  api:
    container_name: meridian-api

    build:
      context: .
      target: api

    env_file:
      - ./apps/api/.env

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-meridian}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-meridian}?schema=public
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      MAIL_FROM: "Meridian <no-reply@meridian.local>"

      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: meridian-api
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_LOG_LEVEL: WARN
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=meridian,deployment.environment.name=local

    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      jaeger:
        condition: service_started

    ports:
      - "3001:3001"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    container_name: meridian-web

    build:
      context: .
      target: web
      args:
        API_ORIGIN: http://api:3001

    restart: unless-stopped

    environment:
      NODE_ENV: production
      API_ORIGIN: http://api:3001
      APP_ORIGIN: http://localhost:3000
      AUTH_COOKIE_SECURE: "false"
      AUTH_ACCESS_COOKIE_MAX_AGE_SECONDS: "900"
      AUTH_REFRESH_COOKIE_MAX_AGE_SECONDS: "604800"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "3000:3000"

volumes:
  meridian_postgres_data: